name: X Monitor

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Cache Playwright browser binary
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json') }}

      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: node monitor.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YT_DISCORD_WEBHOOK_URL: ${{ secrets.YT_DISCORD_WEBHOOK_URL }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}

      - name: Commit updated state
        run: |
          git config user.name "x-monitor-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "update state"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (concurrent run?), retrying ($i)..."
            git pull --rebase --autostash
            sleep 3
          done
          git push
